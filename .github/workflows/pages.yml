name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Pages が未設定なら有効化を試みる。
          # 公式仕様では GITHUB_TOKEN 以外のトークンが必要なことがあり、
          # 失敗した場合は Settings > Pages > Source を GitHub Actions にする。
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 同じジョブ内でアップロードした成果物は、そのジョブの完了前には
      # deploy-pages から見えない。ビルドと公開は別ジョブにする。
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
